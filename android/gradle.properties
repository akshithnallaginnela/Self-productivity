# Project-wide Gradle settings.
#
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
#
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# ── JVM ─────────────────────────────────────────────────────────────────────
# AGP 8.13 + Gradle 8.14.3 require a JDK in the 17–21 range. JDK 21 (LTS) is
# the supported target and matches capacitor.build.gradle's sourceCompatibility.
#
# Gradle will NOT start on JDK 25 ("Unsupported class file major version 69").
# If your JAVA_HOME points at a newer JDK, uncomment the line below and point it
# at your JDK 21 install rather than changing JAVA_HOME system-wide:
#
# org.gradle.java.home=C:/Program Files/Java/jdk-21

org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# ── Build performance ───────────────────────────────────────────────────────
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true

# ── AndroidX ────────────────────────────────────────────────────────────────
# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true

# ── Release build hygiene ───────────────────────────────────────────────────
# Only package the resource densities/ABIs actually needed, and keep R classes
# non-transitive so a module change doesn't invalidate every downstream R.
android.nonTransitiveRClass=true
android.nonFinalResIds=true
