<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Deep Obsidian Radial Background -->
    <radialGradient id="eagleBgRadial" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1E2029" />
      <stop offset="70%" stop-color="#111217" />
      <stop offset="100%" stop-color="#090A0D" />
    </radialGradient>

    <!-- Sovereign Gold Highlights -->
    <linearGradient id="sovereignGoldLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="30%" stop-color="#FDE68A" />
      <stop offset="70%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Sovereign Amber Core Gradient -->
    <linearGradient id="sovereignGoldCore" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="45%" stop-color="#F59E0B" />
      <stop offset="85%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <!-- Sovereign Bronze / Shadow Gold Gradient -->
    <linearGradient id="sovereignBronze" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="50%" stop-color="#B45309" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>

    <!-- Dark Shield Metal Gradient -->
    <linearGradient id="shieldMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#242630" />
      <stop offset="50%" stop-color="#161820" />
      <stop offset="100%" stop-color="#0E0F14" />
    </linearGradient>

    <!-- Shield Border Gradient -->
    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="25%" stop-color="#D97706" />
      <stop offset="70%" stop-color="#78350F" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Glowing Drop Shadow Filter -->
    <filter id="eagleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#F59E0B" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#eagleBgRadial)" />

  <!-- Outer Hexagonal Shield with Beveled Chamfers -->
  <path
    d="M 256 36 L 452 124 L 452 320 L 256 476 L 60 320 L 60 124 Z"
    fill="url(#shieldMetal)"
    stroke="url(#shieldBorder)"
    stroke-width="12"
    stroke-linejoin="round"
    stroke-linecap="round"
    filter="url(#eagleGlow)"
  />

  <!-- Inner Subtle Shield Inset Rim -->
  <path
    d="M 256 58 L 432 136 L 432 308 L 256 448 L 80 308 L 80 136 Z"
    fill="none"
    stroke="#F59E0B"
    stroke-width="1.5"
    stroke-opacity="0.35"
    stroke-linejoin="round"
  />

  <!-- Layer 1: Left Wing - Primary Upper Feathers -->
  <path
    d="M 256 160 L 108 108 L 84 180 L 180 208 L 100 236 L 204 268 L 132 308 L 256 380 Z"
    fill="url(#sovereignGoldLight)"
  />

  <!-- Layer 1: Right Wing - Primary Upper Feathers -->
  <path
    d="M 256 160 L 404 108 L 428 180 L 332 208 L 412 236 L 308 268 L 380 308 L 256 380 Z"
    fill="url(#sovereignBronze)"
  />

  <!-- Layer 2: Left Wing - Secondary Tier Feathers -->
  <path
    d="M 256 188 L 132 144 L 112 196 L 200 220 L 136 248 L 220 274 L 172 316 L 256 368 Z"
    fill="url(#sovereignGoldCore)"
  />

  <!-- Layer 2: Right Wing - Secondary Tier Feathers -->
  <path
    d="M 256 188 L 380 144 L 400 196 L 312 220 L 376 248 L 292 274 L 340 316 L 256 368 Z"
    fill="url(#sovereignGoldCore)"
  />

  <!-- Layer 3: Dynamic Feather Rib Separators (Facet Depth) -->
  <path
    d="M 256 188 L 132 144 M 200 220 L 112 196 M 220 274 L 136 248 M 256 368 L 172 316"
    stroke="#161820"
    stroke-width="3"
    stroke-linejoin="round"
  />
  <path
    d="M 256 188 L 380 144 M 312 220 L 400 196 M 292 274 L 376 248 M 256 368 L 340 316"
    stroke="#161820"
    stroke-width="3"
    stroke-linejoin="round"
  />

  <!-- Apex Eagle Crest / Crown Feathers -->
  <polygon points="256,76 292,136 256,172 220,136" fill="#FFFDF5" />
  <polygon points="256,76 256,172 220,136" fill="#FEF3C7" />

  <!-- Piercing Eagle Head & Beak -->
  <polygon points="256,172 300,214 256,252 212,214" fill="#161820" stroke="#FDE68A" stroke-width="2" />
  <!-- Sharp Amber Beak -->
  <polygon points="256,204 286,236 256,268 226,236" fill="url(#sovereignGoldLight)" />
  <polygon points="256,204 256,268 226,236" fill="#D97706" />

  <!-- Center Heart Flame Diamond Crystal -->
  <polygon
    points="256,274 306,328 256,412 206,328"
    fill="#12131A"
    stroke="url(#sovereignGoldLight)"
    stroke-width="5"
    stroke-linejoin="round"
  />

  <!-- Sovereign Inner Ember Crystal Facets -->
  <polygon points="256,290 292,332 256,396 256,290" fill="#F59E0B" />
  <polygon points="256,290 220,332 256,396 256,290" fill="#D97706" />
  <circle cx="256" cy="336" r="10" fill="#FFFBEB" />
</svg>
